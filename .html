<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>validation</title>
<style>
    *{
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }
    body{
        background-color: rgb(213, 246, 148);
    }
    main{
        min-height: 100%;
        display: block;
        align-items: center;
        justify-content: center;
        background-color: rgb(250, 139, 4);
        padding: 10px 10px ;
        margin: 30px 780px;
        margin-top: 180px;
        width: 500px;
        margin-top: 20px;
    }
   h1,h2{
    background-color: aqua;
    box-sizing: border-box;
    margin-top: 10px;
   }
   h2{
    background-color: azure;
   }
   main p{
    color: black;
    font-family: Arial, Helvetica, sans-serif;
    font-style: italic;
    margin-top: 10px;
    margin-bottom: 30px;
    font-weight: bold;
   }
    
    label{
        font-family: Arial, Helvetica, sans-serif;
        font-weight: bold;

    }
    form{
        font-family: Arial, Helvetica, sans-serif;
        display: block;
        align-items: center;
        justify-content: center;
    }
    form input,
    form button,.gender{
        display: block;
        border: 1px solid;
        border-radius: 6px;
        width: 100%;
        margin-top: 6px;
        height: 30px;
    }
    .error{
        color: red;
    }
    button{
        background-color: blue;
        color: white;
    }
</style>
    
</head>
<body>
    <main>
    
        <h1>Open Registration</h1>
        <h2>welcome Alhuda secondarry</h2>
        <p>waxaan idinku soo dhawaynanaa dugsiga sare alhuda secondary school gacmo furan kusoo dhawaada</p>
    

    <form action="validate"">
<label for="fullname">username</label>
<input 
type="text"
name="username"
id="username"
placeholder="Enter your name"
autocomplete="username">
<p id="usernameError" class="error"></p>
<label for="previous school">school</label>
<input 
type="text"
name="school"
id="school"
placeholder="Enter your previous school"
autocomplete="school"
>
<p id="schoolError" class="error"></p>

<label for="age">Age</label>
<input
 type="number"
 name="age"
 id="age"
 placeholder="Enter your age"
 autocomplete="age"
 >
 <p id="ageError" class="error"></p>
 <label for="">Gender</label>
 <select class="gender" name="gender" id="gender">select gender

    <option value="">select gender</option>
    <option value="male">male</option>
    <option value="female">Female</option>
 </select>
 <p id="genderError" class="error"></p>

 <button type="submit" id="bnt">Register</button>

    </form>
    </main>

    <script>
    const username = "ayto";
    const school = "Alhuda";
    

        const usernameInput = document.getElementById("username");
        const schoolInput = document.getElementById("school");
        const ageInput = document.getElementById("age");
        const gender = document.getElementById("gender");



        function validate(){
            let isValid = true;
            if(usernameInput.value ===""){
                document.getElementById("usernameError").textContent = "enter your name";
                isValid = false;
            }
            else if(usernameInput.value !==username){
                document.getElementById("usernameError").textContent ="invalid";
                isValid = false;
            }
            else{
                document.getElementById("usernameError").textContent = "";
            }
            if(schoolInput.value ===""){
                document.getElementById("schoolError").textContent = "enter your school";
                isValid = false;
            }else if(schoolInput.value !== school){
                document.getElementById("schoolError").textContent = "invalid school";
                isValid = false;
            }else{
                document.getElementById("schoolError").textContent = "";
            }if(ageInput.value ===""){
                document.getElementById("ageError").textContent = "enter your age";
                isValid = false;

            }else{
                document.getElementById("ageError").textContent = "";
            }if(gender.value ===""){
                document.getElementById("genderError").textContent = "select gender";
                isValid = false;
            }else{
                document.getElementById("genderError").textContent = "";
            }

        

            return isValid;
            

        };
 
const logInBtn = document.getElementById("bnt");

usernameInput.addEventListener("input", () => {
  document.getElementById("usernameError").textContent = "";
 });
 schoolInput.addEventListener("input", () => {
  document.getElementById("schoolError").textContent = "";
});
 logInBtn.addEventListener("click", (e) => {
  e.preventDefault();

        
 });
 </script>
    
</body>
</html>
